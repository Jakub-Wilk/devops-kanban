# Copy to the platform config dir (Linux: ~/.config/devops-kanban/config.toml).
# See docs/settings.md for every key. Tokens (ADO PAT, 7pace) are NOT stored here — they live in the OS keyring.

organization = "media-press"
default_project = "IT Finance"
default_team = "IT Finance Team"
default_board = "Stories"

poll_interval_secs = 30
cache_enabled = true
log_level = "info"

[api]
base_url = "https://dev.azure.com"
api_version = "7.1"
max_batch = 200

[time_tracking]
enabled = true
base_url = "https://media-press.timehub.7pace.com"
api_version = "3.2"

# Per-board UI preferences, written by the app (Kanban → Columns menu and filters).
# [boards."IT Finance/IT Finance Team/Stories"]
# hidden_columns = ["TEST-FAILED", "Closed"]
# epic = 118181
# assignees = ["@me"]

# Per-team filters, written by the app: the iteration picker, and each tab's filter bar.
