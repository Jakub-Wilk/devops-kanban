[workspace]
resolver = "3"
members = ["crates/ado-client", "crates/sevenpace-client", "crates/kanban-core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
ado-client = { path = "crates/ado-client" }
sevenpace-client = { path = "crates/sevenpace-client" }
kanban-core = { path = "crates/kanban-core" }

dioxus = { version = "0.7", features = ["router"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keyring = { version = "3", features = ["sync-secret-service", "windows-native", "apple-native"] }
directories = "6"
toml = "0.9"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros", "local-offset"] }
base64 = "0.22"
url = { version = "2", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 1
